<style>
:root{--bg:#fff;--side:#f9f9f9;--text:#0d0d0d;--muted:#6b6b6b;--line:#e5e5e5;--hover:#ececec;--bubble:#f0f0f0;--accent:#0d0d0d;--on-accent:#fff;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#212121;--side:#171717;--text:#ececec;--muted:#a0a0a0;--line:#363636;--hover:#2a2a2a;--bubble:#2f2f2f;--accent:#ececec;--on-accent:#171717;--err:#f2b8b5;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
#side{width:260px;flex:none;display:flex;flex-direction:column;gap:6px;background:var(--side);padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em;padding:6px 10px 10px}.lg{width:28px;height:28px;flex:none}.lg.big{display:block;width:76px;height:76px;margin:0 auto 14px}
#new{width:100%;text-align:left;padding:9px 10px;border-radius:10px;font-weight:600}
#new:hover,.item:hover,.item.on,.ghost:hover{background:var(--hover)}
.lbl{font-size:12px;color:var(--muted);padding:10px 10px 2px}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;border-radius:10px}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:9px 10px;text-align:left}
.x{padding:6px 12px;color:var(--muted)}
#col{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
header .logo{flex:1;padding:0}
.ghost{font-size:20px;padding:4px 12px;border-radius:10px}
#chat{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column}
.wrap{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px;flex:1}
.msg{overflow-wrap:anywhere;white-space:pre-wrap}
.user{align-self:flex-end;max-width:85%;background:var(--bubble);padding:8px 16px;border-radius:20px}
.bot.err{color:var(--err)}
.dots span{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
#empty{margin:auto;text-align:center;padding:24px 0;width:100%}
#empty h1{font-size:32px;font-weight:600;margin:0 0 6px;letter-spacing:-.03em}
#empty p{color:var(--muted);margin:0 0 18px}
#setup{display:flex;flex-direction:column;gap:10px;max-width:380px;margin:0 auto;padding:18px;background:var(--side);border:1px solid var(--line);border-radius:20px;text-align:left}
select{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.primary{padding:12px 18px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600}
.primary:disabled{opacity:.5;cursor:not-allowed}
progress{width:100%;height:8px;accent-color:var(--accent)}
.small{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.small.err{color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
.chip:hover{background:var(--hover)}
footer{padding:6px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--bubble);border-radius:26px;padding:6px 6px 6px 18px}
textarea{flex:1;resize:none;max-height:140px;min-height:36px;padding:7px 0;border:0;outline:0;background:none;color:var(--text);font:inherit;line-height:1.5}
#go{width:36px;height:36px;flex:none;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:18px}
#go:disabled{opacity:.25;cursor:default}
#status{max-width:760px;margin:6px auto 0;font-size:12px;color:var(--muted);text-align:center;min-height:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#scrim{display:none}
@media (max-width:800px){
#side{position:fixed;top:0;bottom:0;left:0;width:290px;z-index:20;transform:translateX(-100%);transition:transform .2s}
#side.open{transform:none}
#side.open+#scrim{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.4)}
}
@media (min-width:801px){header{display:none}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#7c7cf0"/></linearGradient></defs><symbol id="logo" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="url(#fg)"/><g stroke="#fff" stroke-width="44" stroke-linecap="round" fill="none"><path d="M156 130V382M156 130H278M156 250H256"/></g><circle cx="354" cy="130" r="26" fill="#fff"/></symbol></svg>
<aside id="side">
  <div class="logo"><svg class="lg" aria-hidden="true"><use href="#logo"/></svg>Far.AI</div>
  <button id="new">+ New chat</button>
  <div class="lbl">Chats</div>
  <div id="list"></div>
</aside>
<div id="scrim"></div>
<div id="col">
<header>
  <button class="ghost" id="menu" aria-label="Chats">☰</button>
  <div class="logo"><svg class="lg" aria-hidden="true"><use href="#logo"/></svg>Far.AI</div>
  <button class="ghost" id="new2" aria-label="New chat">✎</button>
</header>
<main id="chat"><div class="wrap" id="wrap">
  <div id="empty">
    <svg class="lg big" aria-hidden="true"><use href="#logo"/></svg>
    <h1>Far.AI</h1>
    <p>A free AI that runs on your own device. No account, no API key.</p>
    <div id="setup">
      <select id="model" aria-label="Model"></select>
      <button class="primary" id="load">Load Far.AI</button>
      <progress id="bar" max="1" value="0" hidden></progress>
      <div class="small" id="note">First load downloads the model once, then it’s saved in your browser. Needs a browser with WebGPU.</div>
    </div>
    <div class="chips" id="chips" hidden></div>
  </div>
</div></main>
<footer>
  <div class="bar">
    <textarea id="in" rows="1" placeholder="Load Far.AI first…"></textarea>
    <button id="go" disabled aria-label="Send">↑</button>
  </div>
  <div id="status"></div>
</footer>
</div>
<script type="module">
const WEBLLM_URL = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm";
const SYSTEM = "You are Far.AI, a friendly, curious and helpful AI chat companion. Keep answers clear and reasonably concise, and use plain text.";
const MODELS = [
  ["Llama-3.2-1B-Instruct-q4f16_1-MLC", "Fast: Llama 3.2 1B (roughly 1 GB)"],
  ["Qwen2.5-1.5B-Instruct-q4f16_1-MLC", "Balanced: Qwen 2.5 1.5B (roughly 1.5 GB)"],
  ["Llama-3.2-3B-Instruct-q4f16_1-MLC", "Smarter: Llama 3.2 3B (roughly 2.3 GB)"]
];
const SUGGEST = ["Explain something in simple terms", "Help me write a message", "Give me a fun fact", "Plan my day"];
const $ = (id) => document.getElementById(id);
const chat = $("chat"), wrap = $("wrap"), input = $("in"), go = $("go"), emptyEl = $("empty"), side = $("side"), list = $("list");
const KEY = "farai.chats.v2";
let engine = null, busy = false, turns = [], chats = [], cur = null;
try { chats = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { chats = []; }
if (!Array.isArray(chats)) chats = [];
function save() { try { localStorage.setItem(KEY, JSON.stringify(chats.slice(0, 40))); } catch (e) {} }

MODELS.forEach(([id, label]) => {
  const o = document.createElement("option");
  o.value = id; o.textContent = label; $("model").appendChild(o);
});
SUGGEST.forEach((s) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = s;
  b.onclick = () => send(s);
  $("chips").appendChild(b);
});

function toBottom() { chat.scrollTop = chat.scrollHeight; }
function refresh() {
  go.disabled = !engine || (!busy && !input.value.trim());
  go.textContent = busy ? "■" : "↑";
  go.setAttribute("aria-label", busy ? "Stop" : "Send");
}
function addMsg(kind) {
  emptyEl.remove();
  const d = document.createElement("div");
  d.className = "msg " + kind;
  wrap.appendChild(d); toBottom();
  return d;
}
function note(text, isErr) {
  $("note").textContent = text;
  $("note").classList.toggle("err", !!isErr);
}
function renderList() {
  list.innerHTML = "";
  chats.forEach((c) => {
    const row = document.createElement("div");
    row.className = "item" + (c === cur ? " on" : "");
    const t = document.createElement("button");
    t.className = "t"; t.textContent = c.title; t.onclick = () => openChat(c);
    const x = document.createElement("button");
    x.className = "x"; x.textContent = "×"; x.setAttribute("aria-label", "Delete chat");
    x.onclick = () => {
      chats = chats.filter((k) => k !== c); save();
      if (c === cur) startChat(); else renderList();
    };
    row.append(t, x); list.appendChild(row);
  });
}
function openChat(c) {
  cur = c; turns = c.turns; wrap.innerHTML = "";
  c.turns.forEach((t) => { addMsg(t.role === "user" ? "user" : "bot").textContent = t.content; });
  if (!c.turns.length || !engine) wrap.appendChild(emptyEl);
  side.classList.remove("open"); renderList(); toBottom();
}
function startChat() { openChat({ id: Date.now().toString(36), title: "New chat", turns: [] }); }

$("load").onclick = async () => {
  if (!navigator.gpu) {
    note("This browser doesn’t support WebGPU. Try recent Chrome or Edge on a computer, or Safari on iOS 26 or newer, and open the page over https.", true);
    return;
  }
  $("load").disabled = true; $("model").disabled = true; $("bar").hidden = false;
  note("Starting…");
  try {
    const webllm = await import(WEBLLM_URL);
    engine = await webllm.CreateMLCEngine($("model").value, {
      initProgressCallback: (r) => { $("bar").value = r.progress || 0; note(r.text || "Loading…"); }
    });
    $("setup").hidden = true; $("chips").hidden = false;
    if (turns.length) emptyEl.remove();
    input.placeholder = "Message Far.AI…"; input.focus();
    $("status").textContent = "Running on your device. Your chats stay in this browser.";
  } catch (e) {
    engine = null;
    $("load").disabled = false; $("model").disabled = false; $("bar").hidden = true;
    note("Couldn’t load the model. Check your connection, or try a smaller model. (" + ((e && e.message) || "unknown error") + ")", true);
  }
  refresh();
};

async function send(text) {
  text = (text || "").trim();
  if (!text || busy || !engine) return;
  const c = cur, t = c.turns;
  if (!chats.includes(c)) chats.unshift(c);
  if (!t.length) c.title = text.slice(0, 40);
  t.push({ role: "user", content: text });
  addMsg("user").textContent = text;
  const bot = addMsg("bot");
  bot.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  input.value = ""; input.style.height = "auto";
  busy = true; refresh(); renderList();
  let out = "";
  try {
    const stream = await engine.chat.completions.create({
      messages: [{ role: "system", content: SYSTEM }].concat(t.slice(-11)),
      stream: true, temperature: 0.7, max_tokens: 1024
    });
    for await (const chunk of stream) {
      out += (chunk.choices[0] && chunk.choices[0].delta && chunk.choices[0].delta.content) || "";
      if (out) { bot.textContent = out; toBottom(); }
    }
  } catch (e) {
    if (!out) {
      bot.classList.add("err");
      bot.textContent = "Something went wrong while replying. Please try again.";
    }
  }
  if (out) t.push({ role: "assistant", content: out });
  else {
    t.pop();
    if (!t.length) chats = chats.filter((k) => k !== c);
    if (!bot.classList.contains("err")) { bot.classList.add("err"); bot.textContent = "No reply. Please try again."; }
  }
  save(); renderList();
  busy = false; refresh(); input.focus();
}

go.onclick = () => { if (busy && engine) engine.interruptGenerate(); else send(input.value); };
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
  refresh();
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
});
const fresh = () => { if (busy && engine) engine.interruptGenerate(); startChat(); };
$("new").onclick = fresh; $("new2").onclick = fresh;
$("menu").onclick = () => side.classList.add("open");
$("scrim").onclick = () => side.classList.remove("open");
startChat(); refresh();
</script>
</body>
</html>
